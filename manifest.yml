id: org.JimMarshall.WarFarmerGame
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: WarFarmerGame
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --socket=pulseaudio
modules:
  - "shared-modules/lua5.3/lua-5.3.5.json"
  - name: glfw3
    buildsystem: cmake
    sources:
      - type: git
        url: https://github.com/glfw/glfw.git
        tag: "3.4"
  - "python3-jinja2.json"
  - name: WarFarmerGame
    buildsystem: simple
    build-commands:
      - mkdir -p src/game/Stardew/build
      - cd src/game/Stardew/game && python3 make_release_version_header.py 
      - cd src/game/Stardew/build && cmake -DNoGTest=ON .. && make
      - cd src/game/Stardew && ./compile_assets.sh
      - cmake --install src/game/Stardew/build --prefix /app
      - cp -f WarFarmerGame /app/bin/WarFarmerGame
      - chmod +x /app/bin/WarFarmerGame

    sources:
      - type: git
        url: https://github.com/JimMarshall35/2DFarmingRPG.git
        branch: master
        dest: 'src/game'
      - type: file
        path: WarFarmerGame